name: Firestore Security Rules & CI Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firestore.rules.test.ts'
      - 'firebase.json'
      - 'src/**'
      - 'server/**'
      - 'server.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/firestore-rules-tests.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firestore.rules.test.ts'
      - 'firebase.json'
      - 'src/**'
      - 'server/**'
      - 'server.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/firestore-rules-tests.yml'

permissions:
  contents: read

concurrency:
  group: firestore-rules-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-firestore-rules-and-build:
    name: Firestore Rules, API Tests & Build (Node 22 + Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (required by Firebase Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify runtime versions
        run: |
          node -v
          npm -v
          java -version

      - name: Install project dependencies
        run: npm ci

      - name: Install Firebase CLI for local Emulator execution
        run: npm install -g firebase-tools

      - name: Cache Firebase Emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v1

      - name: TypeScript typecheck
        run: npm run lint

      - name: Run Backend API tests
        run: npm run test:api

      - name: Build production bundle
        run: npm run build

      - name: Run Firestore Security Rules tests in Firebase Emulator
        env:
          CI: 'true'
        run: npm run test:rules
